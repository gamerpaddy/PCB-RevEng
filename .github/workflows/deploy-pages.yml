name: Deploy to GitHub Pages

# Publishes the static site (repo root) to GitHub Pages via the Actions
# deploy pipeline, replacing the deprecated "legacy" branch builder that kept
# jamming its queue and timing out.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Do NOT cancel an in-flight run: the
# github-pages environment holds a backend lock while deploying, and killing
# the job mid-deploy leaves that lock set, so the next run dies with
# "Deploy failed, try again later" until the lock clears. Queue instead —
# newer runs wait for the in-flight deploy to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
